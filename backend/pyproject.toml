[project]
name = "botbet-clash-backend"
version = "0.2.0"
description = "AI Prop Betting League backend (Phase 2: persistence + Forecast Lab core)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires a running PostgreSQL database (see app/tests/integration/conftest.py)"]
