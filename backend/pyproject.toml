[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botbet-clash-backend"
version = "0.3.0"
description = "AI Prop Betting League backend (Phase 3: real model adapter layer)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
# `alembic/` (migrations, no __init__.py) is not an importable package and
# must never be picked up by autodiscovery alongside `app/` -- without this,
# setuptools' flat-layout scan finds both and refuses to build, since it
# can't tell which one is the actual project package.
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a running PostgreSQL database (see app/tests/integration/conftest.py)",
    "live_provider: makes a real, billable call to an external model provider; requires that provider's API key env var and is skipped otherwise",
]
